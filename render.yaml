# Render blueprint for the FastAPI backend (the frontend deploys to Vercel).
services:
  - type: web
    name: zoom-clone-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_URL
        value: https://your-app.vercel.app
      - key: CORS_ORIGINS
        value: https://your-app.vercel.app
