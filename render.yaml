services:
  - type: web
    name: zoom-clone-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .

    healthCheckPath: /api/health

    envVars:
      - key: FRONTEND_URL
        value: https://your-app.vercel.app

      - key: CORS_ORIGINS
        value: https://your-app.vercel.app